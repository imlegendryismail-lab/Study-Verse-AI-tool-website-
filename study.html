<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Timer - StudyVerse AI</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<nav>

<div class="logo">

<div class="logo-symbol">
<span class="core"></span>
<span class="ring ring1"></span>
<span class="ring ring2"></span>
</div>

<span class="logo-text">StudyVerse AI</span>

</div>

<div>
<a href="dashboard.html">Dashboard</a>
<a href="tool.html">Tools</a>
<a href="planner.html">Planner</a>
<a href="streak.html">Streak</a>
</div>

</nav>

<section class="hero">

<h1 class="hero-title">Focus Study Timer ⏱</h1>

<p class="hero-sub">
Stay productive using deep-focus study sessions.
</p>

</section>

<section class="container">

<div class="timer-card">

<input type="number"
id="minutes"
placeholder="Enter Minutes"
min="1">

<div class="timer-buttons">

<button onclick="startTimer()">
Start
</button>

<button onclick="pauseTimer()">
Pause
</button>

<button onclick="resetTimer()">
Reset
</button>

</div>

<div class="circle">
<span id="time">00:00</span>
</div>

</div>

</section>

<footer>
© 2026 StudyVerse AI | Smart  learning Powered by AI 

</footer>

<script>

let timer;
let totalTime = 0;
let remaining = 0;

function startTimer(){

const mins =
document.getElementById("minutes").value;

if(!mins && remaining <= 0){
alert("Enter study minutes");
return;
}

if(remaining <= 0){
totalTime = mins * 60;
remaining = totalTime;
}

clearInterval(timer);

timer = setInterval(updateTimer,1000);

}

function pauseTimer(){
clearInterval(timer);
}

function resetTimer(){

clearInterval(timer);

remaining = 0;

document.getElementById("time").innerText =
"00:00";

document.querySelector(".circle").style.background =
"conic-gradient(#8b5cf6 0%, #1e293b 0%)";

}

function updateTimer(){

if(remaining <= 0){

clearInterval(timer);

let studied = totalTime / 60;

let prev =
localStorage.getItem("studyTime") || 0;

localStorage.setItem(
"studyTime",
Number(prev) + studied
);

let sessions =
localStorage.getItem("studySessions") || 0;

localStorage.setItem(
"studySessions",
Number(sessions) + 1
);

localStorage.setItem(
"lastStudyDate",
new Date().toLocaleDateString()
);

alert("Session Complete ✅");

return;
}

remaining--;

let min =
Math.floor(remaining / 60);

let sec =
remaining % 60;

document.getElementById("time").innerText =
`${min}:${sec < 10 ? '0' : ''}${sec}`;

let progress =
(remaining / totalTime) * 100;

document.querySelector(".circle").style.background =
`conic-gradient(#8b5cf6 ${progress}%, #1e293b ${progress}%)`;

}

</script>

</body>
</html>
